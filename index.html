
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuxPlay - Oyun Dünyası</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101018;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #191923;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #343443;
}
.logo { font-size: 27px; font-weight: bold; color: #ff435e; }
.login {
  background: #ff435e;
  border: 0;
  padding: 11px 17px;
  color: white;
  border-radius: 9px;
}
.hero {
  padding: 35px 20px;
  text-align: center;
  background: linear-gradient(135deg,#321323,#17172b);
}
.hero h1 { font-size: 34px; }
.hero p { color: #c4c4d0; }
.container { padding: 20px; max-width: 850px; margin: auto; }
h2 { margin-top: 28px; }
.games {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 13px;
}
.game {
  background: #20202d;
  border: 1px solid #393949;
  border-radius: 14px;
  padding: 20px 10px;
  text-align: center;
}
.emoji { font-size: 38px; }
.game button, .create {
  background: #ff435e;
  color: white;
  border: 0;
  padding: 11px 17px;
  border-radius: 9px;
  margin-top: 10px;
}
.room {
  background: #20202d;
  padding: 20px;
  border-radius: 13px;
  margin-top: 15px;
}
footer {
  padding: 25px;
  text-align: center;
  color: #999;
}
@media(min-width:600px) {
  .games { grid-template-columns: repeat(3,1fr); }
}
</style>
</head>
<body>

<header>
  <div class="logo">♛ LUXPLAY</div>
  <button class="login" onclick="alert('Qeydiyyat sistemi növbəti mərhələdə əlavə olunacaq!')">
    Daxil ol
  </button>
</header>

<section class="hero">
  <h1>Oyun dünyana xoş gəlmisən!</h1>
  <p>Dostlarını çağır, oyun seç və birlikdə əylən.</p>
  <button class="create" onclick="createRoom()">+ Oyun otağı yarat</button>
</section>

<div class="container">
  <h2>🎮 Oyunlar</h2>

  <div class="games">
    <div class="game">
      <div class="emoji">❌⭕</div>
      <h3>X-O Oyunu</h3>
      <button onclick="choose('X-O Oyunu')">Oyna</button>
    </div>

    <div class="game">
      <div class="emoji">🧠</div>
      <h3>Bilik Yarışı</h3>
      <button onclick="choose('Bilik Yarışı')">Oyna</button>
    </div>

    <div class="game">
      <div class="emoji">🎲</div>
      <h3>Zər Oyunu</h3>
      <button onclick="choose('Zər Oyunu')">Oyna</button>
    </div>

    <div class="game">
      <div class="emoji">🃏</div>
      <h3>Kart Oyunu</h3>
      <button onclick="choose('Kart Oyunu')">Oyna</button>
    </div>

    <div class="game">
      <div class="emoji">🔤</div>
      <h3>Söz Oyunu</h3>
      <button onclick="choose('Söz Oyunu')">Oyna</button>
    </div>

    <div class="game">
      <div class="emoji">🏆</div>
      <h3>Yarışma</h3>
      <button onclick="choose('Yarışma')">Oyna</button>
    </div>
  </div>

  <h2>👥 Oyun otaqları</h2>
  <div class="room" id="room">
    Hələ oyun otağı yaradılmayıb.
  </div>
</div>

<footer>
  © 2026 LuxPlay | Bütün hüquqlar qorunur.
</footer>

<script>
function choose(name) {
  alert(name + ' seçildi! Multiplayer sistemi hazırlanır.');
}

function createRoom() {
  let id = Math.random().toString(36).substring(2,8).toUpperCase();
  document.getElementById('room').innerHTML =
    '<h3>Oyun otağı yaradıldı!</h3>' +
    '<p>Otaq kodu: <b>' + id + '</b></p>' +
    '<p>Bu, hələlik yalnız demo otaqdır.</p>';
}
</script>

</body>
  </html>
